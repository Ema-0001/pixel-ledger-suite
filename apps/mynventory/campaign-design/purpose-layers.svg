<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc"><title id="title">MYNVENTORY: the information around a belonging</title><desc id="desc">Four complementary views: identify the item, keep supporting documents, understand value and check important dates. A camera is the illustrative belonging.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#061d2d"/><stop offset="1" stop-color="#12566a"/></linearGradient></defs><rect width="1080" height="1350" fill="url(#bg)"/><g font-family="Arial,sans-serif"><text x="72" y="100" fill="#7ce5d3" font-size="23" letter-spacing="5">MYNVENTORY / OWNERSHIP IN CONTEXT</text><text x="72" y="185" fill="white" font-size="62" font-weight="700">More than an item.</text><text x="72" y="247" fill="#c0dddd" font-size="30">The information you may need later.</text><rect x="72" y="310" width="936" height="220" rx="28" fill="#e8f9f4"/><g fill="#133a4c"><rect x="125" y="383" width="150" height="94" rx="14"/><rect x="155" y="360" width="60" height="27" rx="6"/><circle cx="207" cy="430" r="35" fill="#64cfbe"/><circle cx="207" cy="430" r="22" fill="#164a5d"/></g><text x="325" y="388" fill="#117d87" font-size="23">EXAMPLE BELONGING</text><text x="325" y="440" fill="#102a43" font-size="43" font-weight="700">A camera you own.</text><text x="325" y="486" fill="#315a67" font-size="25">One item. Several useful perspectives.</text><rect x="72" y="580" width="936" height="125" rx="20" fill="#103b4e" stroke="#367580"/><text x="100" y="629" fill="#d8b86e" font-size="28">01</text><text x="170" y="628" fill="white" font-size="34" font-weight="700">Recognise it</text><text x="170" y="671" fill="#c1dddd" font-size="26">The item and its identifying information.</text><rect x="72" y="725" width="936" height="125" rx="20" fill="#103b4e" stroke="#367580"/><text x="100" y="774" fill="#d8b86e" font-size="28">02</text><text x="170" y="773" fill="white" font-size="34" font-weight="700">Keep the proof</text><text x="170" y="816" fill="#c1dddd" font-size="26">Receipts and supporting documents.</text><rect x="72" y="870" width="936" height="125" rx="20" fill="#103b4e" stroke="#367580"/><text x="100" y="919" fill="#d8b86e" font-size="28">03</text><text x="170" y="918" fill="white" font-size="34" font-weight="700">Understand its value</text><text x="170" y="961" fill="#c1dddd" font-size="26">Value and depreciation views.</text><rect x="72" y="1015" width="936" height="125" rx="20" fill="#103b4e" stroke="#367580"/><text x="100" y="1064" fill="#d8b86e" font-size="28">04</text><text x="170" y="1063" fill="white" font-size="34" font-weight="700">Check the dates</text><text x="170" y="1106" fill="#c1dddd" font-size="26">Warranty information and the calendar.</text><path d="M72 1213H1008" stroke="#d8b86e"/><text x="72" y="1268" fill="#d0e6e6" font-size="23">Belongings, documents, value and dates.</text><text x="72" y="1310" fill="#72cbbb" font-size="20">Emanuele Mendola / Pixel Ledger</text></g></svg>