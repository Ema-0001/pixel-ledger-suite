<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1120" viewBox="0 0 1080 1120" role="img" aria-labelledby="t d"><title id="t">MYNVENTORY at a glance</title><desc id="d">The app views show belongings, documents, value and dates. Recording information does not approve a warranty claim, provide a professional valuation or establish independent certification.</desc><rect width="1080" height="1120" rx="26" fill="#0b2b3c"/><g font-family="Arial,sans-serif"><text x="60" y="85" fill="#7ee2cf" font-size="24" letter-spacing="3">MYNVENTORY / AT A GLANCE</text><text x="60" y="160" fill="white" font-size="53" font-weight="700">Useful information.</text><text x="60" y="222" fill="white" font-size="53" font-weight="700">Clear expectations.</text><rect x="60" y="285" width="460" height="218" rx="22" fill="#154656"/><rect x="90" y="313" width="65" height="55" rx="9" fill="none" stroke="#7ee2cf" stroke-width="5"/><path d="M90 330h65" stroke="#7ee2cf" stroke-width="4"/><text x="88" y="422" fill="white" font-size="29" font-weight="700">BELONGINGS</text><text x="88" y="467" fill="#c0dbde" font-size="24">Recognise what you own.</text><rect x="550" y="285" width="460" height="218" rx="22" fill="#154656"/><rect x="580" y="307" width="50" height="67" rx="5" fill="none" stroke="#7ee2cf" stroke-width="5"/><path d="M590 328h30m-30 17h30" stroke="#7ee2cf" stroke-width="4"/><text x="578" y="422" fill="white" font-size="29" font-weight="700">DOCUMENTS</text><text x="578" y="467" fill="#c0dbde" font-size="24">Keep the supporting context.</text><rect x="60" y="530" width="460" height="218" rx="22" fill="#154656"/><rect x="90" y="590" width="14" height="25" rx="3" fill="#7ee2cf"/><rect x="112" y="575" width="14" height="40" rx="3" fill="#7ee2cf"/><rect x="134" y="555" width="14" height="60" rx="3" fill="#7ee2cf"/><text x="88" y="667" fill="white" font-size="29" font-weight="700">VALUE</text><text x="88" y="712" fill="#c0dbde" font-size="24">See the recorded value.</text><rect x="550" y="530" width="460" height="218" rx="22" fill="#154656"/><rect x="580" y="558" width="65" height="55" rx="6" fill="none" stroke="#7ee2cf" stroke-width="5"/><path d="M580 575h65m-48-28v18m30-18v18" stroke="#7ee2cf" stroke-width="4"/><text x="578" y="667" fill="white" font-size="29" font-weight="700">DATES</text><text x="578" y="712" fill="#c0dbde" font-size="24">Keep warranty dates in view.</text><rect x="60" y="810" width="950" height="245" rx="22" fill="#34433e"/><text x="88" y="861" fill="#e6c67e" font-size="26" font-weight="700">WHAT THESE VIEWS DO NOT PROMISE</text><text x="88" y="914" fill="#eee7d5" font-size="25">Warranty information is not claim approval.</text><text x="88" y="963" fill="#eee7d5" font-size="25">A value view is not a professional valuation.</text><text x="88" y="1012" fill="#eee7d5" font-size="25">Internal review is not independent certification.</text></g></svg>