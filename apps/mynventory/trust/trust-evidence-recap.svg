<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1450" viewBox="0 0 1200 1450" role="img" aria-labelledby="title desc"><title id="title">MYNVENTORY internal testing and developer review</title><desc id="desc">Internal testing and developer review confirmed by Emanuele Mendola. Human responsibility remains with the developer. No external audit or certification is claimed.</desc><rect width="1200" height="1450" fill="#082737"/><g font-family="Arial,sans-serif"><text x="72" y="106" fill="#72deca" font-size="24" letter-spacing="5">MYNVENTORY / DEVELOPER CONFIRMATION</text><text x="72" y="202" fill="white" font-size="65" font-weight="700">Tested internally.</text><text x="72" y="281" fill="white" font-size="65" font-weight="700">Reviewed by its developer.</text><text x="72" y="345" fill="#b9d9de" font-size="27">A clear statement of who has reviewed the work.</text><rect x="72" y="415" width="1056" height="177" rx="23" fill="#123f50" stroke="#3c7981"/><circle cx="118" cy="463" r="15" fill="#69dac5"/><path d="M110 463l6 6 10-12" fill="none" stroke="#123c4a" stroke-width="3"/><text x="153" y="473" fill="white" font-size="34" font-weight="700">Internal testing</text><text x="105" y="528" fill="#8be6d4" font-size="27">Confirmed by the developer</text><text x="105" y="568" fill="#c3dce0" font-size="23">Developer confirmation recorded on 18 October 2026.</text><rect x="72" y="620" width="1056" height="177" rx="23" fill="#123f50" stroke="#3c7981"/><circle cx="118" cy="668" r="15" fill="#69dac5"/><path d="M110 668l6 6 10-12" fill="none" stroke="#123c4a" stroke-width="3"/><text x="153" y="678" fill="white" font-size="34" font-weight="700">Developer review</text><text x="105" y="733" fill="#8be6d4" font-size="27">Confirmed by the developer</text><text x="105" y="773" fill="#c3dce0" font-size="23">Review is internal, with the app developer as its source.</text><rect x="72" y="825" width="1056" height="177" rx="23" fill="#123f50" stroke="#3c7981"/><circle cx="118" cy="873" r="15" fill="#69dac5"/><path d="M110 873l6 6 10-12" fill="none" stroke="#123c4a" stroke-width="3"/><text x="153" y="883" fill="white" font-size="34" font-weight="700">AI assistance</text><text x="105" y="938" fill="#8be6d4" font-size="27">Human responsibility</text><text x="105" y="978" fill="#c3dce0" font-size="23">AI helps with building. Responsibility remains human.</text><rect x="72" y="1030" width="1056" height="177" rx="23" fill="#123f50" stroke="#3c7981"/><circle cx="118" cy="1078" r="15" fill="#69dac5"/><path d="M110 1078l6 6 10-12" fill="none" stroke="#123c4a" stroke-width="3"/><text x="153" y="1088" fill="white" font-size="34" font-weight="700">Standards reference</text><text x="105" y="1143" fill="#8be6d4" font-size="27">No certification claimed</text><text x="105" y="1183" fill="#c3dce0" font-size="23">ISO/IEC 42001 is a governance reference.</text><path d="M72 1284H1128" stroke="#c5a65f"/><text x="72" y="1334" fill="#d6e8e8" font-size="23">Internal confirmation, not independent certification.</text><text x="72" y="1388" fill="#8cc1c8" font-size="21">Emanuele Mendola / Pixel Ledger</text></g></svg>